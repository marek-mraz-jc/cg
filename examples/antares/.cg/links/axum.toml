# NGSI-LD API routes: api_routes() in crates/antares-api/src/lib.rs lists them as
# ("/entities/{id}", get(read).patch(merge)) tuples; router() nests the list under /ngsi-ld/v1.
# -> provides "GET /ngsi-ld/v1/entities/{}" on handler `read`.
[[link]]
name = "api-routes"
channel = "http"
role = "provides"
files = ["crates/antares-api/src/lib.rs"]
pattern = '(?s)\(\s*"(?P<key>/[^"]+)"\s*,(?P<body>.*?)\)\s*,?\s*\)'
each = '(?P<verb>get|post|put|patch|delete|head|options)\(\s*(?P<symbol>[\w:]+)'
key = "{verb} {key}"
prefix = "/ngsi-ld/v1"
# /ex routes sit outside the /ngsi-ld/v1 nest; pinned in admin.toml
skip = ['^/ex/']
